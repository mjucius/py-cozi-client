name: Release py-cozi-client

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.2)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install package with dev dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      run: pytest

    - name: Install build tooling
      run: pip install build

    - name: Update version in pyproject.toml
      run: |
        sed -i "s/^version = .*/version = \"${{ github.event.inputs.version }}\"/" pyproject.toml
    
    - name: Update version in __init__.py
      run: |
        sed -i "s/__version__ = .*/__version__ = \"${{ github.event.inputs.version }}\"/" __init__.py
    
    - name: Commit version bump
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add pyproject.toml __init__.py
        git commit -m "Bump version to ${{ github.event.inputs.version }}" || exit 0
        git push
    
    - name: Build package
      run: python -m build
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.event.inputs.version }}
        name: Release v${{ github.event.inputs.version }}
        draft: false
        prerelease: false
        files: |
          dist/py_cozi_client-${{ github.event.inputs.version }}-py3-none-any.whl
          dist/py_cozi_client-${{ github.event.inputs.version }}.tar.gz
        body: |
          ## Changes in v${{ github.event.inputs.version }}

          See the [CHANGELOG.md](CHANGELOG.md) for details.

          ## Installation

          ```bash
          pip install py-cozi-client==${{ github.event.inputs.version }}
          ```

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}