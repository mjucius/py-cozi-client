name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result; one old version failing should not hide
      # whether the others are fine.
      fail-fast: false
      matrix:
        # Matches requires-python = ">=3.10" in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Show resolved dependency versions
        # The 2.1.0 release broke because CI resolved a different aiohttp than
        # any developer had locally. Printing the resolution makes that visible
        # in the log instead of leaving it to be discovered at release time.
        run: pip list | grep -Ei "aiohttp|aioresponses|pydantic|pytest"

      - name: Run tests
        run: pytest

      - name: Examples compile
        run: python -m py_compile examples/*.py

      - name: Package imports even when generic module names are taken
        # 2.x shipped top-level modules named models/utils/exceptions, which clashed
        # with anything else of the same name. 3.0 is a single cozi_client package.
        run: python -c "import sys, types; sys.modules['models'] = types.ModuleType('models'); import cozi_client; print(cozi_client.__version__)"

  aiohttp-latest:
    # Early warning for the failure mode that broke the 2.1.0 release: the dev
    # extra pins `aiohttp<3.14` because aioresponses cannot build a
    # ClientResponse on 3.14, so every matrix job above tests against a capped
    # aiohttp and would never notice a genuine incompatibility. This job removes
    # the cap and runs the tests that do not depend on aioresponses: the model
    # tests and the contract tests, which drive the client over a real socket
    # against tests/stub_cozi.py.
    name: newest aiohttp (early warning)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install with the aiohttp ceiling lifted
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install --upgrade "aiohttp>=3.14"
          pip list | grep -Ei "aiohttp|aioresponses"

      - name: Library must work on the newest aiohttp
        # No aioresponses in these files. A failure here means aiohttp actually
        # broke the client and users installing it today are affected -- worth
        # a red run.
        run: pytest tests/test_contract_*.py tests/test_models_*.py tests/test_exceptions.py
